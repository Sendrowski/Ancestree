# Read the Docs configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
    # autodoc imports ancestree (docs/conf.py reads __version__ from it), so
    # the package and its runtime dependencies have to be installed too.
    - method: pip
      path: .
