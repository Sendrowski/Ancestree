# Install dependencies with uv and run the (non-slow) test suite with coverage on Linux, macOS and
# Windows with Python 3.11, and on Linux with 3.12 to 3.14, on every push / PR to main.
# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: tests

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '**.rst']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '**.rst']
  workflow_dispatch:

permissions:
  contents: read

env:
  # numba's on-disk JIT cache persists between runs, so the cold compile cost
  # is not paid on every CI run (see _jit_kernel.py / _smc_kernel.py, cache=True)
  NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba_cache

jobs:
  test:
    name: run tests on ${{ matrix.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # 3.14 is outside the declared range and runs for information only
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Admit the experimental Python version
        if: matrix.experimental == true
        shell: bash
        run: sed -i -E 's/<3\.14"/<3.15"/' pyproject.toml
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Cache numba JIT
        uses: actions/cache@v4
        with:
          path: ${{ env.NUMBA_CACHE_DIR }}
          key: numba-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('ancestree/_jit_kernel.py', 'ancestree/_smc_kernel.py') }}
      - name: Install ancestree + test deps
        # ``[all]`` pulls the optional cyvcf2 / zarr / newick / msprime / matplotlib backends,
        # so every source / writer path is exercised. cyvcf2 has no Windows build, and the
        # tests needing it skip there.
        # The test dependencies come from the ``dev`` group in pyproject.toml,
        # which is where they are declared.
        run: uv pip install --system -e ".[all]" --group dev
      - name: Run tests
        # Windows runs without -x so a run lists every platform-specific failure.
        run: pytest --cov ancestree --cov-report=xml testing/ -m "not slow" ${{ runner.os != 'Windows' && '-x' || '' }}
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && matrix.python == '3.11'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
