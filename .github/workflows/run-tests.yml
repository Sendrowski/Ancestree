# Install dependencies with uv and run the (non-slow) test suite with
# coverage on every push / PR to main.
# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: tests

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '**.rst']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '**.rst']
  workflow_dispatch:

permissions:
  contents: read

env:
  # numba's on-disk JIT cache persists between runs, so the cold compile cost
  # is not paid on every CI run (see _jit_kernel.py / _smc_kernel.py, cache=True)
  NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba_cache

jobs:
  test:
    name: run tests on ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Cache numba JIT
        uses: actions/cache@v4
        with:
          path: ${{ env.NUMBA_CACHE_DIR }}
          key: numba-${{ runner.os }}-${{ hashFiles('ancestree/_jit_kernel.py', 'ancestree/_smc_kernel.py') }}
      - name: Install ancestree + test deps
        # ``[all]`` pulls the optional cyvcf2 / zarr / newick / msprime / matplotlib backends
        # (manylinux wheels on Linux), so every source / writer path is exercised.
        # The test dependencies come from the ``dev`` group in pyproject.toml,
        # which is where they are declared.
        run: uv pip install --system -e ".[all]" --group dev
      - name: Run tests
        run: pytest --cov ancestree --cov-report=xml testing/ -m "not slow" -x
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
