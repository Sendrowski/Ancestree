# Full test environment: superset of base.yml with every optional dependency the
# suite gates on (numba, zarr, cyvcf2, newick, slim+pyslim) plus the VCF-Zarr
# interoperability toolchain (bio2zarr writes VCZ, vcztools reads it back), so
# `pytest -m "slow or not slow"` runs with zero skips (see `make test-full`).
# vcztools and bio2zarr both require zarr>=3, so this env pins zarr 3; the
# library itself still supports zarr 2 (see pyproject).
#   mamba env create -f workflow/envs/dev.yaml && mamba activate dev-ancestree && pip install -e .
name: dev-ancestree
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - tskit>=1.0
  - tqdm>=4.60
  - numba>=0.60
  - llvmlite>=0.43
  - cyvcf2
  - zarr>=3.1
  - slim
  - pyslim
  # Test runner and plugins, as in fastDFE's dev.yaml. xdist matters here:
  # the suite is JIT- and simulation-heavy, so it runs as one multi-core job
  # with `pytest -n <cores>` rather than serially.
  - pytest>=8
  - pytest-cov>=5
  - matplotlib-base>=3.7
  - pytest-xdist>=3
  # Per-test wall clock, so one hung test fails and names itself instead
  # of stalling the whole run until the job hits its slurm limit.
  - pytest-timeout>=2
  # `make typecheck`: the package is py.typed, so its annotations are a
  # published contract and this is what checks them.
  - mypy>=1.11
  - msprime>=1.3
  - pip
  - pip:
      - newick
      - bio2zarr   # VCF -> VCZ, to build the interop fixture
      - vcztools   # reads the written stores back, for the interop test
      - sfsutils-popgen   # parses the AA / AA_prob annotations, for the interop test
      - -e ../..   # editable install of local ancestree pkg; ../.. = repo root relative to .snakemake/conda (for --use-conda)
