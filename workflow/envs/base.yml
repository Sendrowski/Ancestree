# Ancestree base environment, created by snakemake --use-conda.
#
# Excludes fastDFE and PolarBEAR, which run under their own envs
# (fastdfe.yml, polarbear.yml).
name: ancestree-base
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - tskit>=1.0
  - tqdm>=4.60
  - numba>=0.59
  - pytest>=8
  - pytest-cov>=5
  - msprime>=1.3
  - cyvcf2
  - snakemake-minimal=9.23.0
  - pip
  - llvmlite>=0.42
  - pytest-timeout>=2.3
  - pip:
      - -e ../..   # editable install of local ancestree pkg; ../.. = repo root relative to .snakemake/conda (for --use-conda)
  # Called by the fetch / install shell rules, which otherwise rely on
  # whatever the host PATH happens to carry.
  - git
  - curl
