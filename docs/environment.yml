# Docs-build environment for Ancestree.
#
# Usage:
#   mamba env create -f docs/environment.yml
#   mamba activate docs-ancestree
#   pip install -e .              # install the package itself so autodoc resolves
#   cd docs && sphinx-build -b html . _build/html
#
# Lighter than workflow/envs/base.yml (no pytest), but carries what the
# notebooks import so the refresh rule can execute them.
name: docs-ancestree
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  # ancestree runtime deps (so autodoc can import it)
  - numpy>=1.24
  - scipy>=1.10
  - tskit>=1.0
  - tqdm>=4.60
  # docs toolchain
  # sphinx-argparse 0.5.2 calls sphinx.ext.autodoc.mock as a function, which
  # became a module in Sphinx 9, so the arg tables fail to build there.
  - sphinx>=7.0,<9
  # 1.4.0 (pydata-sphinx-theme 0.20) breaks the mobile sidebar toggle,
  # so this matches the bound in docs/requirements.txt.
  - sphinx-book-theme>=1.3,<1.4
  - sphinx-autodoc-typehints>=2.0,<3.6
  - sphinx-copybutton>=0.5
  - autodocsumm>=0.2
  - myst-nb>=1.0
  - sphinx-argparse>=0.4
  # notebook execution (refresh committed outputs via the snakemake rule)
  - nbconvert>=7.0
  - ipykernel>=6.0
  # used in the notebooks
  - msprime>=1.3
  - newick>=1.9
  - matplotlib>=3.7
  - cyvcf2>=0.30
  - numba>=0.59
  - zarr>=3
  - pip
  - pip:
      # PyPI-only: sphinx-paramlinks is not published on conda-forge or
      # bioconda, so listing it as a conda dep makes the whole solve fail.
      - sphinx-paramlinks>=0.6
      # PyPI-only as well, the VCF to VCF Zarr converter to_zarr() uses.
      - bio2zarr
